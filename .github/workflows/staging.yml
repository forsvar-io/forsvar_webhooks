name: Build and Push Docker Image

on:
  push:
    branches:
      - staging  # Change this to your default branch if different

jobs:
  build:
    runs-on: ubuntu-latest

    env:  # Define environment variables at the job level
      IMAGE_NAME: staging-$(date +%Y%m%d%H%M%S)

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: Set image name with date
        id: vars
        run: |
          IMAGE_TAG=staging-$(date +%Y%m%d%H%M%S)
          echo "IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/$IMAGE_TAG" >> $GITHUB_ENV        

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPOSITORY_NAME }}/forsvar-webhooks-staging:latest .

      - name: Configure Docker Client of Gcloud
        run:  |-
          gcloud auth configure-docker --quiet
          gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev --quiet

      - name: Push Docker image
        run: |
          docker push ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPOSITORY_NAME }}/forsvar-webhooks-staging:latest

      # Obtener credenciales del cluster (gke-gcloud-auth-plugin oficial)
      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: crowder-cluster
          location: ${{ secrets.REGION }}

      # Set image en el deployment.
      # OJO: el target es el CONTAINER POR NOMBRE, no el wildcard '*='. Con '*=' kubectl
      # pisa la imagen de TODOS los containers del pod — incluido el initContainer
      # cloud-sql-proxy (native sidecar), que queda apuntando a la imagen de la app y
      # crashea con `executable file not found in $PATH`. Eso dejó este deployment sin
      # poder rolear durante 8 días (2026-07-13 → 2026-07-21) sirviendo una imagen vieja,
      # y en silencio: el pod anterior seguía Running, así que Available=True.
      # deploy-prod.yml ya usa la forma por nombre; esto lo alinea.
      - name: Set image on deployment
        run: kubectl set image deployment/forsvar-webhooks 'forsvar-webhooks-container=${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}' -n staging

      # Rollout
      - name: Roll out deployment
        run: kubectl rollout restart deployment/forsvar-webhooks -n staging
